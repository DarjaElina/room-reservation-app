name: Deployment pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
    types: [opened, synchronize]
      
jobs:
  test_and_lint:
      runs-on: ubuntu-latest
      
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-node@v4
          with:
            node-version: '20'
        
        - name: Install dependencies
          run: npm ci

        - name: Run ESLint
          run: npm run lint

        - name: Run Prettier
          run: npm run format
        
        - name: Run Jest tests
          run: npm run test

        - name: Setup EAS
          uses: expo/expo-github-action@v8
          with:
            eas-version: latest
            token: ${{ secrets.EXPO_TOKEN }}
        
        - name: Export app as a production website
          run: npx expo export --platform web

        - name: Deploy app
          run: eas deploy --prod