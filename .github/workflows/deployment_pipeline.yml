name: Deployment pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
    types: [opened, synchronize]
      
jobs:
  test_and_lint:
      runs-on: macos-latest

      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-node@v4
          with:
            node-version: '20'
        
        - name: Install dependencies
          run: npm ci

        - name: Run ESLint
          run: npm run lint

        - name: Run Prettier
          run: npm run format
        
        - name: Run Jest tests
          run: npm run test

        - name: Setup EAS
          uses: expo/expo-github-action@v8
          with:
            eas-version: latest
            token: ${{ secrets.EXPO_TOKEN }}

        - name: Send EAS build request
          run: eas build --platform ios --non-interactive --no-wait --profile development-simulator
          shell: bash

        - name: Install dependencies and Maestro
          run: curl -fsSL "https://get.maestro.mobile.dev" | bash
