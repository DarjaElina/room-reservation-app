name: Deployment pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
    types: [opened, synchronize]
      
jobs:
  test_and_lint:
      runs-on: macos-latest
      
      steps:
        - uses: actions/checkout@v4
        - uses: maxim-lobanov/setup-xcode@v1
          with:
            xcode-version: latest-stable
        - uses: actions/setup-node@v4
          with:
            node-version: '20'
        
        - name: Install dependencies
          run: npm ci

        - name: Run ESLint
          run: npm run lint

        - name: Run Prettier
          run: npm run format
        
        - name: Run Jest tests
          run: npm run test

        - name: Setup EAS
          uses: expo/expo-github-action@v8
          with:
            eas-version: latest
            token: ${{ secrets.EXPO_TOKEN }}

        - name: Install jq for JSON output processing
          run: brew install jq

        - name: Install Maestro
          run: curl -fsSL "https://get.maestro.mobile.dev" | bash
        
        - name: List simulators
          run: xcrun simctl list devices available

        - name: Start iOS Simulator
          run: |
            # Find a simulator by name (e.g., iPhone 15)
            DEVICE_ID=$(xcrun simctl list devices available --json | jq -r '.devices[] | .[] | select(.name == "iPhone 16") | .udid' | head -n 1)
            DEVICE_STATE=$(xcrun simctl list devices available --json | jq -r --arg DEVICE_ID "$DEVICE_ID" '.devices[] | .[] | select(.udid == $DEVICE_ID) | .state')
            
            if [ -z "$DEVICE_ID" ]; then
              echo "No available simulator found for the criteria."
              exit 1
            fi
            
            echo "DEVICE_ID=$DEVICE_ID" >> $GITHUB_ENV
            
            if [ "$DEVICE_STATE" != "Booted" ]; then
              # Boot the simulator if it's not already booted
              xcrun simctl boot "$DEVICE_ID"
              # Wait a bit for the simulator to boot
              sleep 30
            else
              echo "Simulator with DEVICE_ID=$DEVICE_ID is already booted."
            fi

        - name: Download and install the latest build on the iOS Simulator
          run: eas build:run -p ios --latest 

        - name: Run Maestro Login test
          run: |
            export PATH="$PATH:$HOME/.maestro/bin"
            maestro --device $DEVICE_ID test maestro/login.yaml

        - name: Run other Maestro tests
          run: |
            export PATH="$PATH:$HOME/.maestro/bin"
            maestro --device $DEVICE_ID test --exclude-tags=login maestro
      
